s:["Toe Maria en Josef eindelik in Betlehem aankom, was die dorp stampvol mense. Klop, klop. ‘Jammer, geen plek nie!’ Klop, klop. ‘Ons is vol!’ Daar was nêrens om te bly nie, en Maria se baba sou nou-nou kom.","Uiteindelik het hulle ’n plek gekry waar diere gehou is. Dit was nie ’n paleis nie. Dit het seker gestink, met strooi op die vloer, ’n donkie en dalk ’n paar koeie en skape. En daar, daardie selfde nag, is baba Jesus gebore!","Maria het Hom styf in doeke toegedraai en Hom in ’n krip neergelê, ’n voerbak vir diere.","Dink hieraan: Jesus is die Koning van die hele heelal. Hy het die sterre en die oseane gemaak! Maar Hy het nie met ’n kroon en ’n kasteel gekom nie. Hy het as ’n klein babatjie in ’n stal gekom. Dit noem ons nederig. Jesus het klein gekom sodat almal, ryk of arm, naby aan Hom kon kom."],
v:["Sy het Hom in doeke toegedraai en in ’n krip neergelê, omdat daar vir hulle geen plek was nie.","Lukas 2:7"],
l:["Jesus, die Koning van alles, het as ’n klein baba gekom.","Jesus is nederig, en Hy het vir almal gekom.","Ons kan plek maak in ons harte vir Jesus."],
q:["As Jesus na ons huis toe kom, waar sou jy wou hê moet Hy slaap?","Hoe kan ons plek maak vir Jesus in ons harte?"],
p:"Liewe Jesus, / U het as ’n klein babatjie gekom / omdat U ons liefhet. / Daar is altyd plek vir U in my hart. Amen.",
m:["V","Doen môre een hulpvaardige werkie sonder dat iemand vra, soos die tafel afdek of wegpak."]},

{t:"Engele in die Naghemel",r:"Lukas 2:8–20",g:"Vreugde",tr:"God se goeie nuus is vreugde vir almal",sc:"night hills ; 👼150,72,36 👼252,60,30 🐑100,170,30 🔥305,170,28",
s:["In die veld naby Betlehem het ’n paar skaapwagters in die donker na hulle skape gekyk. Dit was ’n stil, gewone nag. Toe skielik, FLITS! ’n Engel het verskyn, en God se heerlikheid het rondom hulle geskyn! Die skaapwagters was doodbang.","‘Moenie bang wees nie!’ het die engel gesê. ‘Ek bring vir julle goeie nuus wat groot vreugde vir almal sal wees! Vandag is in Betlehem vir julle ’n Verlosser gebore. Hy is Christus die Here! Julle sal die baba in doeke toegedraai in ’n krip vind.’","Toe was die hele hemel skielik vol engele, meer as wat jy kan tel, en hulle het gesing: ‘Eer aan God in die hoogste hemel, en vrede op aarde!’","Die skaapwagters het na Betlehem gehardloop en baba Jesus gevind, net soos die engel gesê het. Toe vertel hulle almal wat hulle teëkom! God het die goeie nuus eerste aan gewone skaapwagters vertel, want Jesus het vir almal gekom."],
v:["Ek bring vir julle goeie nuus wat groot vreugde sal wees vir al die mense.","Lukas 2:10"],
l:["Die goeie nuus van Jesus is vir almal.","God se nuus bring groot vreugde.","As ons Jesus ontmoet, wil ons ander vertel."],
q:["Wat sou jy doen as jy ’n hemel vol engele sien?","Vir wie kan ons die goeie nuus vertel?"],
p:"Liewe God, / dankie vir die goeie nuus van Jesus! / Vul my hart met vreugde / en help my om ander te vertel. Amen.",
m:["V","Sing môre ’n Kersliedjie vir iemand."]},

{t:"Volg die Ster!",r:"Matteus 2:1–12",g:"Gids",tr:"God lei mense wat na Hom soek",sc:"night desert star ; 🐫110,168,46 🐫172,170,40 🎁252,172,28",
s:["Ver in die ooste het ’n paar wyse manne die sterre bestudeer. Een nag sien hulle ’n splinternuwe, ekstra helder ster. ‘’n Nuwe koning is gebore!’ het hulle gesê. ‘Kom ons gaan aanbid Hom!’","Toe laai hulle hul kamele vol skatte en vertrek op ’n lang avontuur, en volg die ster oor woestyne en berge. Eers het hulle na koning Herodes se paleis in Jerusalem gegaan en gevra: ‘Waar is die baba wat gebore is om koning te wees?’ (Herodes was glad nie bly oor nog ’n koning nie!) Die leermeesters het in God se Woord gekyk en gesê: ‘Betlehem!’","Die ster het voor hulle uit gegaan en reg bo die huis waar Jesus was, gaan staan. Die wyse manne was vol vreugde! Hulle het gebuig en Jesus aanbid, en Hom geskenke van goud, wierook en mirre gegee.","Hulle het na Jesus gesoek, en God het hulle die hele pad na Hom toe gelei."],
v:["Julle sal My soek en vind as julle My met julle hele hart soek.","Jeremia 29:13"],
l:["God lei mense wat na Hom soek.","Jesus is ’n lang reis werd om te vind.","Ons kan Jesus ons beste geskenk gee: ons harte."],
q:["Watter geskenk sou jy vir baba Jesus gee?","Hoe lei God ons vandag na Hom toe? (Die Bybel, die kerk, Mamma en Pappa.)"],
p:"Liewe God, / dankie dat U my na Jesus lei. / Ek gee Hom my beste geskenk: / my hele hart. Amen.",
m:["V","Maak of draai ’n klein geskenkie toe vir iemand in jou familie."]},

{t:"Die Beste Geskenk Ooit",r:"Johannes 3:16, 1 Johannes 4:8",g:"Liefde",tr:"God is liefde",sc:"night town star ; 🎁240,172,28 🎄305,162,46",
s:["Môre is dit Kersfees! Kan jy die opwinding voel? Geskenke onder die boom, lekker kos, familie bymekaar.","Maar hoekom gee ons geskenke met Kersfees? Omdat God die heel eerste en heel beste Kersgeskenk gegee het: Jesus!","Onthou jy hoe Adam en Eva in die tuin weggekruip het? Sonde (die verkeerde dinge wat ons doen) sit ’n muur tussen ons en God. Ons kan nie self oor daardie muur klim nie. Toe het God, wat ons so liefhet, Jesus gestuur om die muur af te breek en ons terug te bring na Hom toe, sodat ons weer sy kinders kan wees. Dit is hoekom die engel gesê het: ‘’n Verlosser is gebore!’ ’n Verlosser is ’n Redder.","God het Jesus nie gestuur omdat ons goed genoeg was nie. Hy het Hom gestuur omdat Hy ons liefhet. Nie net ’n bietjie nie, maar SO baie. Die Bybel sê: ‘God is liefde.’ Liefde is hoe God is, heeltemal deur en deur."],
v:["God het die wêreld so liefgehad dat Hy sy enigste Seun gegee het.","Johannes 3:16"],
l:["Jesus is God se geskenk aan ons.","God het Jesus gestuur omdat Hy ons so baie liefhet.","Jesus het gekom om ons te red en terug te bring na God toe."],
q:["Wat is die beste geskenk wat jy nog ooit gekry het?","Hoe is Jesus ’n selfs beter geskenk?"],
p:"Liewe God, / dankie vir die beste geskenk ooit: Jesus! / Dankie dat U my so baie liefhet. / Ek is ook lief vir U. Amen.",
m:["V","Sing môre, voor jy geskenke oopmaak, ‘Veels geluk’ vir Jesus."]},

{c:1,xmas:1,t:"Kerskampvuur: Veels Geluk, Jesus!",sc:"night hills stable,star ; 👶200,160,28 🎉80,90,30 🎂320,170,34",
intro:"Geseënde Kersfees, ontdekker! Vandag vier ons Jesus se verjaarsdag. Onthou jy die belofte wat God in die tuin gemaak het, die leidrade wat Hy vir Jesaja en Miga gegee het, die engel se besoek aan Maria, die lang reis na Betlehem en die baba in die krip? Elke belofte het waar geword. God het vir ons sy heel beste geskenk gegee.",
game:"Speel die Kersverhaal na met speelgoed of die Kerskrip. Steek dan ’n kers aan (saam met Mamma!) en sing ‘Veels geluk’ vir Jesus.",
q:["Wat was jou gunstelingdeel van die Kersverhaal?","Watter geskenk kan jy vandag vir Jesus gee?"],
p:"Veels geluk, Jesus! / Dankie dat U gekom het om by ons te wees. / U is God se beste geskenk, / en ek is so bly U het gekom. Amen.",
m:["V","Druk vandag iemand styf vas en sê vir hulle: ‘Jesus het gekom omdat God jou liefhet!’"]},

{t:"Jesus se Grootste Redding",r:"Lukas 23",g:"Verlosser",tr:"Jesus het my so lief dat Hy sy lewe vir my gegee het",sc:"sunset hills cross ; ❤️312,80,26",
s:["Baba Jesus het grootgeword en wonderlike dinge gedoen. Hy het mense gesond gemaak, storms laat bedaar en almal liefgehad. Maar ’n paar leiers was jaloers en kwaad vir Jesus. Hulle het nie geglo Hy is God se Seun nie.","Op ’n hartseer dag het hulle Jesus gevang en Hom aan ’n houtkruis gesit om te sterf. Jesus het nog nooit iets verkeerd gedoen nie, nie eens een keer nie! Hoekom het Hy dit dan laat gebeur? Jesus kon ’n miljoen engele geroep het om Hom te help. Maar Hy het gekies om aan die kruis te bly, uit liefde.","Onthou jy die muur wat sonde tussen ons en God sit? Aan die kruis het Jesus al die verkeerde dinge wat ons nog ooit gedoen het, op Hom geneem, sodat ons vergewe kan word. Dit was soos ’n vriend wat instap en die skuld vir ons vat. Aan die kruis het Jesus selfs gebid vir die mense wat Hom seergemaak het: ‘Vader, vergewe hulle.’","Toe het Jesus gesterf, en sy vriende het sy liggaam in ’n graf gesit, ’n grot wat in die rots uitgekap is. Hulle was so hartseer. Maar wag… dit is nie die einde van die storie nie!"],
v:["God het sy groot liefde vir ons bewys deurdat Christus vir ons gesterf het toe ons nog sondaars was.","Romeine 5:8"],
l:["Jesus het die kruis gekies omdat Hy ons liefhet.","Jesus het die straf vir ons verkeerde dinge gevat sodat ons vergewe kan word.","Jesus het selfs die mense vergewe wat Hom seergemaak het."],
q:["Hoe laat dit jou voel dat Jesus jou so baie liefhet?","Die kruis is nou ’n teken van God se liefde. Waar het jy al kruise gesien?"],
p:"Liewe Jesus, / dankie dat U my so liefhet / dat U aan die kruis vir my gesterf het. / Dankie dat U my sonde wegneem. Amen.",
m:["T","Maak ’n kruis met twee stokkies of twee kryte om jou aan Jesus se liefde te herinner."]},

{t:"Hy Leef!",r:"Matteus 28:1–10",g:"Lewend!",tr:"Jesus leef en is sterker as die dood",sc:"dawn hills tomb ; ✨140,90,22 🌸300,172,24 🌸325,170,20",
s:["Vroeg op Sondagoggend, drie dae nadat Jesus gesterf het, het ’n paar vroue na die graf gegaan. Hulle was hartseer, en hulle het gewonder: ‘Wie sal die groot klip van die deur af wegrol?’","Maar toe hulle daar kom, RUMMEL! Die aarde het geskud, en die klip was al weggerol! ’n Engel het daarop gesit, so helder soos weerlig. ‘Moenie bang wees nie,’ het die engel gesê. ‘Ek weet julle soek na Jesus. Hy is nie hier nie. Hy het opgestaan, net soos Hy gesê het!’","Die graf was LEEG! Die vroue het gehardloop om die dissipels te vertel, bang en baie bly gelyk. En op pad, raai wie het hulle ontmoet? JESUS! Lewend! Hulle het by sy voete neergeval en Hom aanbid.","Jesus het die dood oorwin! Hy is sterker as enigiets. En omdat Hy leef, sal almal wat Hom vertrou, ook vir altyd by God lewe."],
v:["Hy is nie hier nie; Hy het opgestaan, net soos Hy gesê het!","Matteus 28:6"],
l:["Jesus leef! Hy het weer lewendig geword.","Jesus is sterker as die dood, sonde en enigiets wat bang maak.","Omdat Jesus leef, kan ons vir altyd by God wees."],
q:["Hoe dink jy het die vroue gevoel toe hulle Jesus sien?","Kom ons skree dit saam: ‘Jesus LEEF!’"],
p:"Liewe Jesus, / U leef! / U het sonde en die dood oorwin. / Dankie dat ek vir altyd by U kan lewe. Amen.",
m:["V","Sê môre vir iemand: ‘Jesus leef!’"]},

{t:"Ontbyt op die Strand",r:"Johannes 21",g:"Maak My Nuut",tr:"Jesus vergewe my en gee my ’n nuwe begin",sc:"dawn beach ; ⛵120,100,38 🔥230,170,32 🐟272,172,22",
s:["Voordat Jesus gesterf het, het sy vriend Petrus iets gedoen wat hom baie hartseer gemaak het. Drie keer het mense hom gevra: ‘Ken jy Jesus?’ En drie keer was Petrus bang en het gesê: ‘Nee! Ek ken Hom nie!’ Daarna het Petrus gehuil en gehuil.","Nadat Jesus weer lewendig geword het, het Petrus saam met sy vriende gaan visvang. Hulle het die hele nag gevis en niks gevang nie (klink bekend?). In die oggend het ’n man op die strand geroep: ‘Gooi julle net aan die regterkant uit!’ Hulle het, en die net was vol met 153 visse! ‘Dit is die Here!’ sê Johannes. Petrus was so opgewonde dat hy in die water gespring en strand toe geswem het!","Jesus het ’n vuur gemaak en ontbyt gekook. Nadat hulle geëet het, vra Jesus vir Petrus: ‘Petrus, het jy My lief?’ ‘Ja, Here, U weet ek het U lief.’ Jesus het hom drie keer gevra, een keer vir elke keer wat Petrus nee gesê het. Toe sê Jesus: ‘Sorg vir my skape.’","Jesus het Petrus nie net vergewe nie. Hy het hom weer ’n belangrike werk gegee."],
v:["As ons ons sondes bely, sal Hy ons vergewe.","1 Johannes 1:9"],
l:["Jesus vergewe ons as ons jammer sê.","Jesus gee ons nie op as ons misluk nie.","Jesus gee ons ’n nuwe begin en ’n werk om te doen."],
q:["Hoe dink jy het Petrus gevoel toe Jesus vra: ‘Het jy My lief?’","Wat sou jy sê as Jesus jou vra?"],
p:"Liewe Jesus, / dankie dat U my vergewe / en my nooit opgee nie. / Ja, Jesus, ek is lief vir U! Amen.",
m:["V","Eet ’n spesiale ontbyt saam met Mamma en gesels oor Jesus se ontbyt op die strand."]},

{t:"Die Helper Kom",r:"Handelinge 1 – 2",g:"Helper",tr:"God woon in my deur sy Heilige Gees",sc:"day town ; 🌬️90,60,34 🔥200,100,22 🔥230,95,22 🔥260,100,22",
s:["Ná veertig dae het Jesus sy vriende teen ’n heuwel op geneem. ‘Ek gaan terug na my Vader in die hemel,’ het Hy gesê. ‘Maar Ek sal julle nie alleen los nie. Ek sal vir julle die Heilige Gees stuur, die Helper.’ Toe gaan Jesus op in die lug totdat ’n wolk Hom weggesteek het.","Sy vriende het gewag en saam gebid in ’n kamer in Jerusalem. Tien dae later was daar ’n geluid soos ’n sterk wind, WOEESJ, wat die hele huis gevul het. Klein vlammetjies, soos vuur, het op elkeen van hulle gerus, en hulle is met die Heilige Gees vervul! Skielik kon hulle in tale praat wat hulle nooit geleer het nie, en hulle het almal dapper van Jesus vertel. Daardie dag het omtrent 3 000 mense besluit om Jesus te volg!","Die Heilige Gees is God wat woon in almal wat Jesus volg. Hy help ons as ons hartseer is, maak ons dapper, herinner ons aan wat Jesus gesê het en help ons om reg te doen.","Jy hoef nooit sonder God enige plek heen te gaan nie."],
v:["Ek sal die Vader vra, en Hy sal julle ’n ander Helper gee om vir altyd by julle te wees.","Johannes 14:16"],
l:["Die Heilige Gees is God wat woon in die wat Jesus volg.","Die Heilige Gees help ons, troos ons en maak ons dapper.","Ons hoef nooit alleen te wees nie."],
q:["Waarmee wil jy hê moet die Heilige Gees jou help?","Jy kan nie die wind sien nie, maar jy kan sien wat dit doen. Hoe is die Heilige Gees so?"],
p:"Liewe God, / dankie vir die Heilige Gees, my Helper. / Vul my asseblief en help my / om gaaf, dapper en goed te wees. Amen.",
m:["R","Blaas borrels of kyk hoe die wind in die bome waai, en onthou die Heilige Gees."]},

{t:"Gaan Vertel die Wêreld!",r:"Matteus 28:16–20",g:"Altyd by My",tr:"Jesus is altyd by my, en Hy stuur my op sy avontuur",sc:"day mountain ; 🌍322,62,32 👣200,172,28",
s:["Voordat Jesus teruggegaan het hemel toe, het Hy sy vriende op ’n berg bymekaargemaak en vir hulle die grootste avontuuropdrag ooit gegee!","‘Gaan na al die mense in die wêreld,’ het Hy gesê, ‘en maak hulle my volgelinge. Doop hulle, en leer hulle om alles te doen wat Ek julle geleer het.’ Dit is ’n reuse werk! Die hele wêreld? Hoe kon ’n paar vriende dit doen?","Toe gee Jesus hulle die beste belofte van almal: ‘En onthou, Ek is by julle al die dae, tot aan die einde.’","En hulle het dit gedoen! Hulle het mense vertel, wat meer mense vertel het, wat nog meer mense vertel het… 2 000 jaar lank! Die goeie nuus het oor see en berge en woestyne gereis, totdat iemand eendag jou familie vertel het, en nou vertel Mamma vir jou! Jy is deel van Jesus se groot avontuur. En die beste deel? Jesus is by jou op elke tree van die pad."],
v:["En onthou, Ek is by julle al die dae tot aan die einde.","Matteus 28:20"],
l:["Jesus het sy volgelinge ’n opdrag gegee: vertel die wêreld van Hom.","Die goeie nuus is 2 000 jaar lank aangegee, tot by jou!","Jesus is altyd by ons op sy opdrag."],
q:["Wie het vir Mamma van Jesus vertel? (Mamma, vertel jou storie!)","Vir wie kan jy vertel?"],
p:"Liewe Jesus, / dankie dat U altyd by my is. / Stuur my op u avontuur. / Help my om ander van U te vertel. Amen.",
m:["V","Nooi ’n maatjie kerk toe, of vertel hulle ’n Bybelstorie wat jy geleer het."]},

{c:1,fin:1,t:"Groot Kampvuur: Die Avontuur Begin Eers",sc:"night campfire star ; 🔥200,165,54 ⛺80,165,44 🧭320,166,36",
intro:"Jy het dit gedoen, ontdekker! Ses-en-vyftig aande op die Lanternpad. Jy het skat ná skat versamel oor wie God is: Skepper, Heilig, Magtig, Goed, Vriendelik, Koning, Vriend, Verlosser. Maar dit is nie die einde nie. Om ’n kind van God en ’n vriend van Jesus te wees, is ’n avontuur wat vir altyd hou.",
game:"Skatkaart-hersiening: blaai saam deur die Roetekaart. Laat hom sy drie gunstelingskatte kies en vir jou vertel hoekom.",
q:["Wat is die heel beste ding wat jy oor God geleer het?","Wat wil jy vanaand vir God sê?"],
p:"Liewe God, / dankie vir die Lanternpad. / Dankie dat U my gewys het wie U is. / Ek wil U elke dag van my lewe / beter en beter leer ken. Amen.",
m:["T","Gebruik elke dag die Vriendskapskompas: Praat, Luister, Vertrou, Liefhê."]}
];
D.forEach((d,i)=>{d.n=i+1;d.ex=EX.find(e=>d.n>=e.from&&d.n<=e.to)});

/* ---------- SCENES ---------- */
const SKY={day:["#78C3F0","#D5EFFB"],dawn:["#F4A07A","#FDE5C1"],sunset:["#E3667B","#F8C778"],night:["#07122C","#253A70"],storm:["#3C4658","#8A95A6"]};
let uid=0;
function starPts(cx,cy,r1,r2){let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?r2:r1;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1))}return p.join(" ")}
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function scene(code,seed){
  const [head,pr=""]=code.split(";");const w=head.trim().split(/\s+/);const sky=w[0],land=w[1],ex=(w[2]||"").split(",");
  const id="g"+(uid++);const r=rnd(seed||7);const [c1,c2]=SKY[sky];
  let s=`<svg viewBox="0 0 400 180" role="img" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="180" fill="url(#${id})"/>`;
  if(sky==="night"){for(let i=0;i<40;i++){s+=`<circle cx="${(r()*400).toFixed(0)}" cy="${(r()*100).toFixed(0)}" r="${(r()*1.4+.4).toFixed(1)}" fill="#FFF6D8" opacity="${(r()*.6+.4).toFixed(2)}"/>`}
    if(!ex.includes("star"))s+=`<circle cx="340" cy="38" r="15" fill="#FFF3C4"/><circle cx="347" cy="33" r="13" fill="${c1}"/>`}
  if(sky==="day")s+=`<circle cx="345" cy="38" r="22" fill="#FFD24A"/><circle cx="345" cy="38" r="32" fill="#FFD24A" opacity=".25"/>`;
  if(sky==="dawn")s+=`<circle cx="70" cy="118" r="30" fill="#FFCD6A"/>`;
  if(sky==="sunset")s+=`<circle cx="330" cy="112" r="32" fill="#FFB24C"/>`;
  if(sky==="storm")s+=`<ellipse cx="90" cy="34" rx="90" ry="26" fill="#566174"/><ellipse cx="260" cy="26" rx="120" ry="28" fill="#4C576A"/><g stroke="#C9D3E0" stroke-width="1.5" opacity=".7">${Array.from({length:22},()=>{const x=r()*400,y=r()*120+30;return `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-6).toFixed(0)}" y2="${(y+14).toFixed(0)}"/>`}).join("")}</g>`;
  if(ex.includes("star"))s+=`<circle cx="300" cy="40" r="30" fill="#FFF3C4" opacity=".18"/><polygon points="${starPts(300,40,16,6.5)}" fill="#FFE27A"/>`;
  if(ex.includes("rainbow"))["#E85D5D","#F2A33A","#F5D547","#5DBB63","#4A90D9","#8E6CCF"].forEach((c,i)=>{const R=150-i*8;s+=`<path d="M${200-R} 150 A${R} ${R} 0 0 1 ${200+R} 150" fill="none" stroke="${c}" stroke-width="8" opacity=".85"/>`});
  const L={
    hills:`<ellipse cx="90" cy="182" rx="210" ry="62" fill="#86C98A"/><ellipse cx="330" cy="190" rx="230" ry="70" fill="#5AA866"/>`,
    sea:`<rect y="100" width="400" height="80" fill="${sky==="storm"?"#2A4F74":sky==="night"?"#1D3C6B":"#2F7FC1"}"/>`+[112,128,146,164].map((y,i)=>`<path d="M0 ${y} q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2" transform="translate(${i%2?-25:0} 0)"/>`).join(""),
    beach:`<rect y="96" width="400" height="84" fill="${sky==="storm"?"#2A4F74":"#3A8CCB"}"/><path d="M0 108 q25 -6 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2"/><path d="M0 150 Q200 124 400 146 L400 180 L0 180Z" fill="#EBD08E"/>`,
    desert:`<ellipse cx="80" cy="188" rx="230" ry="62" fill="#E8C372"/><ellipse cx="340" cy="194" rx="230" ry="66" fill="#D7A754"/>`,
    mountain:`<polygon points="50,160 200,30 350,160" fill="#7B8699"/><polygon points="168,60 200,30 232,60 216,66 200,56 184,66" fill="#F1F4F8"/><rect y="150" width="400" height="30" fill="#6AA86F"/>`,
    river:`<ellipse cx="90" cy="182" rx="210" ry="62" fill="#86C98A"/><ellipse cx="330" cy="190" rx="230" ry="70" fill="#5AA866"/><path d="M0 150 Q100 136 200 146 T400 140 L400 162 Q300 168 200 166 T0 172Z" fill="#4A9BE0"/>`,
    town:`<rect y="148" width="400" height="32" fill="#D8B878"/>`+[[20,108],[88,118],[262,112],[330,104]].map(([x,y])=>`<rect x="${x}" y="${y}" width="56" height="${150-y}" fill="#EEDFBE"/><rect x="${x+21}" y="${130}" width="14" height="20" fill="#9A6B3F"/><rect x="${x+6}" y="${y+8}" width="10" height="9" fill="#9A6B3F"/>`).join("")+`<circle cx="116" cy="118" r="14" fill="#EEDFBE"/>`,
    cave:`<rect y="140" width="400" height="40" fill="#6B5A45"/><path d="M0 0 L130 0 Q95 80 70 180 L0 180Z" fill="#4A3C2F"/><path d="M400 0 L270 0 Q305 80 330 180 L400 180Z" fill="#4A3C2F"/>`,
    redsea:`<rect y="118" width="400" height="62" fill="#E5C88A"/><path d="M0 40 Q90 30 150 60 L160 180 L0 180Z" fill="#2F7FC1"/><path d="M150 60 L160 180" stroke="#BFE2FF" stroke-width="5"/><path d="M400 40 Q310 30 250 60 L240 180 L400 180Z" fill="#2F7FC1"/><path d="M250 60 L240 180" stroke="#BFE2FF" stroke-width="5"/>`,

function showGuide(){
  app.innerHTML=`<section class="page gutter"><div class="inner prose">
  <header class="day-head"><span class="eyebrow" style="--exc:var(--forest)">Vir Mamma</span><h1>Hoe die Lanternpad werk</h1></header>
  <p>Elke aand is een stop op die pad. Elke Bybelverhaal ontbloot ’n <b>skat</b>: een deel van God se karakter, soos <i>God is heilig</i>, <i>God voorsien</i> of <i>Jesus hou nooit op om na my te soek nie</i>. Oor 56 aande versamel jou seun hulle almal, en leer hy langs die pad wat dit beteken om ’n kind van God en ’n vriend van Jesus te wees.</p>
  <p>Daar is 8 ekspedisies. Elkeen eindig met ’n <b>Kampvuuraand</b>: ’n hersieningsaand met ’n speletjie, die week se Skatvers en geen nuwe storie nie, sodat die waarhede kan insink.</p>
  <h2>Vanaand se ritme (10 tot 15 minute)</h2>
  <ol class="rhythm">
   <li><span><b>Steek die lantern aan.</b> Maak die ligte dof en skakel ’n flitslig of bedlampie aan. Dit word sy teken dat dit tyd is vir die pad.</span></li>
   <li><span><b>Storiepad.</b> Lees die storie hardop. Laat hom die klankeffekte maak (WOESJ, KRAAK, BRUL) en na die prent wys.</span></li>
   <li><span><b>God se Woord sê.</b> Lees die vers in die praatborrel. Sê dit drie keer: fluisterend, gewoon, en met ’n groot ontdekkerstem.</span></li>
   <li><span><b>Skat gevind.</b> Lees die drie kort lesse. Die eerste een is gewoonlik die hoofgedagte.</span></li>
   <li><span><b>Avontuurgesels.</b> Vra een of twee vrae. Kort antwoorde is goed. Jy hoef nie almal te gebruik nie.</span></li>
   <li><span><b>Praat met God.</b> Jy sê ’n reël, hy sê dit agterna. Gee hom dan ’n oomblik om sy eie woorde by te voeg.</span></li>
   <li><span><b>Ontdekkersending.</b> ’n Klein dingetjie om môre te probeer. Tik op “Ons het dit gedoen! Versamel die skat” om daardie klip op die kaart te laat oplig.</span></li>
   <li><span><b>Goeienag-woorde.</b> Voor die ligte afgaan, sê saam: “Ek is ’n kind van God en ’n vriend van Jesus!” As julle dit elke aand sê, word dit wie hy weet hy is.</span></li>
  </ol>
  <h2>Waar die pad uitkom</h2>
  <p>As Dag 1 op <b>6 November</b> is, volg die pad die kalender so:</p>
  <div class="dates"><div><b>Dag 1</b><span>6 November</span></div><div><b>Dag 26</b><span>1 Desember</span></div><div><b>Dag 43</b><span>18 Desember: die Kerspad begin</span></div><div><b>Dag 49</b><span>24 Desember</span></div><div><b>Dag 50</b><span>25 Desember: Kerskampvuur</span></div><div><b>Dag 56</b><span>31 Desember: Groot Kampvuur</span></div></div>
  <p>As jy later begin of ’n paar aande mis, moenie bekommerd wees nie. Spring net op <b>18 Desember na Dag 43</b> sodat Dag 50 op Kersdag val, en lees enige oorgeslaande stories in die nuwe jaar of op ’n kampvuuraand.</p>
  <h2>Wenke vir ’n 5-jarige</h2>

   <li>Wriemel is normaal. Laat hom die flitslig, ’n speelding of ’n klein kruisie vashou terwyl jy lees.</li>
   <li>Speel dit uit: marsjeer om die bed vir Jerigo, skud die bed vir Jona se storm.</li>

   <li>Hou dit liewer warm en kort as volledig. ’n Deel oorslaan is beter as ’n moeë, knorrige einde van die dag.</li>
   <li>Hou ’n kinderbybel naby. As hy meer wil hê, lees dieselfde storie daaruit.</li>
   <li>Die verse word in eenvoudige woorde vir jong kinders gegee. Met die verwysings kan jy hulle in jou eie Bybel opsoek.</li>
  </ul>

  <p><a class="btn" href="#day-${nextDay()}">Gaan na Dag ${nextDay()}</a></p>
  </div></section>`;

function showCompass(){
  const pts=[["T","talk","Praat","Ons praat met God in gebed. Ons kan Hom enigiets vertel: dankie, jammer, asseblief, en wat vandag gebeur het. Hy hoor altyd."],["L","listen","Luister","God praat met ons meestal deur die Bybel. As ons sy stories en verse lees, leer ons ken hoe Hy is."],["R","trust","Vertrou","’n Kind vertrou sy pa, en vriende vertrou mekaar. Ons glo God is goed en doen wat Hy sê, selfs as dit moeilik is of vreemd lyk."],["V","love","Liefhê","Ons het God die liefste van almal, en ons wys dit deur die mense rondom ons lief te hê: deur te deel, te vergewe en gaaf te wees."]];
  app.innerHTML=`<section class="page gutter"><div class="inner prose">
  <header class="day-head"><span class="eyebrow" style="--exc:var(--forest)">Vriendskapskompas</span><h1>Kind van God, vriend van Jesus</h1></header>
  <p>God wil sy liefdevolle Vader wees, en Jesus wil sy beste vriend wees. ’n Kind bly naby ’n goeie pa, en vriende spandeer tyd saam: hulle praat, hulle luister, hulle vertrou mekaar en hulle wys liefde. Elke Ontdekkersending op die pad wys na een van hierdie vier rigtings, sodat hy ’n regte verhouding met God oefen, nie net feite oor Hom nie.</p>
  <div class="compass-wrap"><svg viewBox="0 0 200 200" aria-label="Kompas met vier punte: Praat, Luister, Vertrou, Liefhê"><circle cx="100" cy="100" r="92" fill="var(--surface)" stroke="var(--line)" stroke-width="4"/><circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 6"/><polygon points="100,22 112,100 88,100" fill="var(--talk)"/><polygon points="178,100 100,112 100,88" fill="var(--listen)"/><polygon points="100,178 88,100 112,100" fill="var(--trust)"/><polygon points="22,100 100,88 100,112" fill="var(--love)"/><circle cx="100" cy="100" r="9" fill="var(--amber)"/><text x="100" y="16" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--talk)">PRAAT</text><text x="100" y="196" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--trust)">VERTROU</text><text x="190" y="80" text-anchor="end" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--listen)">LUISTER</text><text x="10" y="80" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--love)">LIEFHÊ</text></svg>
  <div class="points">${pts.map(p=>`<div class="point" style="--pc:var(--${p[1]})"><h3>${p[2]}</h3><p>${p[3]}</p></div>`).join("")}</div></div>
  <h2>Hoe word ek ’n kind van God en ’n vriend van Jesus?</h2>
  <p>Verduidelik dit vir hom in drie eenvoudige stappe, op dieselfde manier as wat die pad dit vertel:</p>
  <ol class="tips"><li><b>God het my gemaak en het my lief</b> (Dae 1–3). Hy wil naby my wees.</li><li><b>Sonde sit ’n muur tussen ons</b> (Dae 3 en 49). Die verkeerde dinge wat ons doen, hou ons ver van God af.</li><li><b>Jesus het die muur afgebreek</b> (Dae 49–52). Hy het vir my sonde gesterf en weer lewendig geword. As ek jammer sê en Jesus vra om my Here en my vriend te wees, vergewe God my, word ek sy kind, en woon sy Heilige Gees in my.</li></ol>
  <p>Die Groot Kampvuur op Dag 56 sluit ’n eenvoudige gebed in wat hy kan bid as hy Jesus wil volg.</p>
  </div></section>`;

function route(){
  const h=location.hash.slice(1);let tab="map";
  if(/^day-\d+$/.test(h)){showDay(parseInt(h.slice(4),10));tab="day"}
  else if(h==="guide"){showGuide();tab="guide"}
  else if(h==="compass"){showCompass();tab="compass"}
  else showMap();
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
