s:["Baby Jesus grew up and did amazing things. He healed people, calmed storms and loved everyone. But some leaders were jealous and angry with Jesus. They didn’t believe he was God’s Son.","One sad day, they arrested Jesus and put him on a wooden cross to die. Jesus had never done anything wrong, not even once! So why did he let it happen? Jesus could have called a million angels to help him. But he chose to stay on the cross, because of love.","Remember the wall that sin puts between us and God? On the cross, Jesus took all the wrong things we have ever done onto himself, so we could be forgiven. It was like a friend stepping in to take the blame for us. On the cross, Jesus even prayed for the people hurting him: ‘Father, forgive them.’","Then Jesus died, and his friends put his body in a tomb, a cave cut into rock. They were so sad. But wait… this is not the end of the story!"],
v:["God showed his great love for us by sending Christ to die for us while we were still sinners.","Romans 5:8"],
l:["Jesus chose the cross because he loves us.","Jesus took the punishment for our wrong things so we can be forgiven.","Jesus forgave even the people who hurt him."],
q:["How does it make you feel that Jesus loves you that much?","The cross is now a sign of God’s love. Where have you seen crosses?"],
p:"Dear Jesus, / thank you for loving me so much / that you died on the cross for me. / Thank you for taking away my sin. Amen.",
m:["T","Make a cross with two sticks or two crayons to remind you of Jesus’ love."]},

{t:"He Is Alive!",r:"Matthew 28:1–10",g:"Alive!",tr:"Jesus is alive and stronger than death",sc:"dawn hills tomb ; ✨140,90,22 🌸300,172,24 🌸325,170,20",
s:["Early on Sunday morning, three days after Jesus died, some women went to the tomb. They were sad, and they wondered, ‘Who will roll away the huge stone from the door?’","But when they got there, RUMBLE! The earth shook, and the stone was already rolled away! An angel was sitting on it, shining as bright as lightning. ‘Don’t be afraid,’ said the angel. ‘I know you are looking for Jesus. He is not here. He has risen, just as he said!’","The tomb was EMPTY! The women ran to tell the disciples, scared and joyful all at once. And on the way, guess who met them? JESUS! Alive! They fell at his feet and worshipped him.","Jesus beat death! He is stronger than anything. And because he is alive, everyone who trusts in him will live forever with God too."],
v:["He is not here; he has risen, just as he said!","Matthew 28:6"],
l:["Jesus is alive! He came back to life.","Jesus is stronger than death, sin and anything scary.","Because Jesus lives, we can be with God forever."],
q:["How do you think the women felt when they saw Jesus?","Let’s shout it together: ‘Jesus is ALIVE!’"],
p:"Dear Jesus, / you are alive! / You beat sin and death. / Thank you that I can live with you forever. Amen.",
m:["V","Tell someone tomorrow: ‘Jesus is alive!’"]},

{t:"Breakfast on the Beach",r:"John 21",g:"Makes Me New",tr:"Jesus forgives me and gives me a fresh start",sc:"dawn beach ; ⛵120,100,38 🔥230,170,32 🐟272,172,22",
s:["Before Jesus died, his friend Peter had done something that made him very sad. Three times, people asked him, ‘Do you know Jesus?’ And three times, Peter was scared and said, ‘No! I don’t know him!’ Afterwards Peter cried and cried.","After Jesus came back to life, Peter went fishing with his friends. They fished all night and caught nothing (sound familiar?). In the morning, a man on the beach called, ‘Throw your net on the right side!’ They did, and the net filled with 153 fish! ‘It’s the Lord!’ said John. Peter was so excited that he jumped into the water and swam to shore!","Jesus had made a fire and was cooking breakfast. After they ate, Jesus asked Peter, ‘Peter, do you love me?’ ‘Yes, Lord, you know I love you.’ Jesus asked him three times, once for each time Peter had said no. Then Jesus said, ‘Take care of my sheep.’","Jesus didn’t just forgive Peter. He gave him an important job again."],
v:["If we confess our sins, he will forgive us.","1 John 1:9"],
l:["Jesus forgives us when we say sorry.","Jesus doesn’t give up on us when we fail.","Jesus gives us a fresh start and a job to do."],
q:["How do you think Peter felt when Jesus asked, ‘Do you love me?’","What would you say if Jesus asked you?"],
p:"Dear Jesus, / thank you that you forgive me / and never give up on me. / Yes, Jesus, I love you! Amen.",
m:["V","Have a special breakfast with Mom and talk about Jesus’ beach breakfast."]},

{t:"The Helper Comes",r:"Acts 1 – 2",g:"Helper",tr:"God lives in me by his Holy Spirit",sc:"day town ; 🌬️90,60,34 🔥200,100,22 🔥230,95,22 🔥260,100,22",
s:["After forty days, Jesus took his friends up a hill. ‘I’m going back to my Father in heaven,’ he said. ‘But I won’t leave you alone. I will send you the Holy Spirit, the Helper.’ Then Jesus went up into the sky until a cloud hid him.","His friends waited and prayed together in a room in Jerusalem. Ten days later there was a sound like a mighty wind, WHOOOOSH, that filled the whole house. Little flames, like fire, rested on each of them, and they were filled with the Holy Spirit! Suddenly they could speak in languages they had never learned, and they bravely told everyone about Jesus. That day about 3,000 people decided to follow Jesus!","The Holy Spirit is God living inside everyone who follows Jesus. He helps us when we are sad, makes us brave, reminds us of what Jesus said and helps us do what is right.","You never have to go anywhere without God."],
v:["I will ask the Father, and he will give you another Helper to be with you forever.","John 14:16"],
l:["The Holy Spirit is God living in those who follow Jesus.","The Holy Spirit helps us, comforts us and makes us brave.","We never have to be alone."],
q:["What would you like the Holy Spirit to help you with?","You can’t see the wind, but you can see what it does. How is the Holy Spirit like that?"],
p:"Dear God, / thank you for the Holy Spirit, my Helper. / Please fill me and help me / to be kind, brave and good. Amen.",
m:["R","Blow bubbles or watch the wind in the trees, and remember the Holy Spirit."]},

{t:"Go and Tell the World!",r:"Matthew 28:16–20",g:"Always With Me",tr:"Jesus is with me always, and he sends me on his adventure",sc:"day mountain ; 🌍322,62,32 👣200,172,28",
s:["Before Jesus went back to heaven, he gathered his friends on a mountain and gave them the biggest adventure mission ever!","‘Go to all the people in the world,’ he said, ‘and make them my followers. Baptise them, and teach them to obey everything I have taught you.’ That is a huge job! The whole world? How could a few friends do that?","Then Jesus gave them the best promise of all: ‘And remember, I am with you always, to the very end.’","And they did it! They told people, who told more people, who told more people… for 2,000 years! The good news travelled across seas and mountains and deserts, until one day someone told your family, and now Mom is telling you! You are part of Jesus’ great adventure. And the best part? Jesus is with you every step of the way."],
v:["And surely I am with you always, to the very end.","Matthew 28:20"],
l:["Jesus gave his followers a mission: tell the world about him.","The good news has been passed on for 2,000 years, all the way to you!","Jesus is always with us on his mission."],
q:["Who told Mom about Jesus? (Mom, share your story!)","Who could you tell?"],
p:"Dear Jesus, / thank you that you are always with me. / Send me on your adventure. / Help me tell others about you. Amen.",
m:["V","Invite a friend to church, or tell them a Bible story you learned."]},

{c:1,fin:1,t:"Grand Campfire: The Adventure Has Only Begun",sc:"night campfire star ; 🔥200,165,54 ⛺80,165,44 🧭320,166,36",
intro:"You did it, explorer! Fifty-six nights on the Lantern Trail. You have collected treasure after treasure about who God is: Creator, Holy, Mighty, Good, Kind, King, Friend, Saviour. But this is not the end. Being a child of God and a friend of Jesus is an adventure that lasts forever.",
game:"Treasure map review: scroll through the Trail Map together. Let her pick her three favourite treasures and tell you why.",
q:["What is your very favourite thing you learned about God?","What do you want to say to God tonight?"],
p:"Dear God, / thank you for the Lantern Trail. / Thank you for showing me who you are. / I want to keep knowing you better and better, / every day of my life. Amen.",
m:["T","Keep using the Friendship Compass every day: Talk, Listen, Trust, Love."]}
];
/* ---------- AGE-7 EXTRAS: [did you know, think deeper, journal] ---------- */
const X={
1:["Scientists think there are more stars in space than grains of sand on all the beaches on Earth. God made every one!","God made everything out of nothing. What does that tell you about how powerful he is?","Draw your favourite part of God’s creation and write one word that describes God underneath."],
2:["Your fingerprints are different from every other person who has ever lived. God made you one of a kind!","If God made you on purpose, how could that help you on a day when you feel not good enough?","Write three things God made special about you."],
3:["The name Eden probably means ‘delight’. God made a garden full of delight for his children.","Why do you think God gave Adam and Eve a choice, instead of just making them obey?","Draw God walking in the garden. Write underneath: ‘God comes looking for me.’"],
4:["The ark was about as long as one and a half football fields, and taller than a three-storey house!","Noah kept building for years while people probably laughed at him. Is it hard to do the right thing when others don’t?","Draw a rainbow and write one promise God has made to you inside it."],
5:["God knows every star by name (Psalm 147:4). Abraham couldn’t count them, but God can!","Abraham and Sarah waited 25 years for God’s promise. Why do you think God sometimes makes us wait?","Write down something you are waiting and praying for. Draw a star next to it."],
6:["Joseph was 17 when his brothers sold him, and about 30 when he became a leader in Egypt. That’s 13 years of waiting and trusting!","How do you think Joseph was able to forgive brothers who hurt him so badly?","Draw Joseph’s colourful coat. In each colour, write something God has helped you through."],
8:["Moses’ basket was made of papyrus, the same plant the Egyptians used to make paper.","Miriam was brave and quick-thinking. How can you be brave and helpful for your family?","Write a thank-you note to God for watching over you."],
9:["In many Bibles, God’s special name is printed as LORD in capital letters. It comes from ‘I AM’.","What does it mean that God is holy? How is he different from everyone else?","Write ‘Holy, holy, holy’ in your best decorated letters."],
10:["God led his people with a tall cloud by day and a pillar of fire by night. They never needed a map!","The people were stuck between the sea and an army. When do you sometimes feel stuck?","Draw the walls of water and write Exodus 14:14 on the dry path in the middle."],
11:["Each person gathered about two litres of manna a day: just enough food for that day.","God gave just enough for each day. Why do you think he didn’t give a whole year’s worth at once?","Make a list of ten things God gives you every day."],
12:["The Bible says the Ten Commandments were written on stone ‘by the finger of God’ (Exodus 31:18).","Which of the ten rules do you think is the hardest for girls your age? Why?","Write the two biggest rules Jesus gave: love God and love others. Draw a heart around them."],
13:["Jericho is one of the oldest cities in the world. People have lived there for thousands and thousands of years.","Why do you think God gave them such an unusual plan?","Draw the walls tumbling down. Write one thing you will trust God with this week."],
15:["Samuel grew up to be a prophet, a judge and the man who anointed Israel’s first two kings.","How can you tell the difference between your own thoughts and God reminding you of something good and true?","Write ‘Speak, Lord, I’m listening.’ Then sit quietly for one minute and draw or write whatever comes to mind."],
16:["Samuel anointed David by pouring oil on his head. It was a sign that God had chosen him.","Why do people often judge others by how they look? How can you look at hearts instead?","Draw a big heart. Inside, write the things God loves to see, like kindness and honesty."],
17:["A shepherd’s sling could send a stone flying faster than a car on the highway!","Is being brave the same as not being scared? What do you think?","Draw your own ‘giant’ (something that scares you). Write Joshua 1:9 across it."],
18:["David wrote about half of the 150 psalms in the Bible, and many of them were songs!","Psalm 23 says God is with us in dark valleys. When might you be in a ‘dark valley’?","Write Psalm 23:1 and draw yourself as a little lamb with the Good Shepherd."],
19:["Mount Carmel means ‘garden of God’. It looks out over the sea.","Elijah’s prayer was short and simple. Does God need fancy words?","Write a short, simple prayer of your own."],
20:["Daniel was probably over 80 years old in the lions’ den. He had been praying three times a day for most of his life!","Daniel kept praying even when it was against the rules. What helps you keep going with God?","Draw a clock and mark three times each day when you will talk to God."],
22:["The Bible says Nineveh was so big that it took three days to walk across it!","Jonah got a second chance, but then he was cross when Nineveh got one too (Jonah 4). Why do you think he felt that way?","Write about a time someone gave you a second chance."],
23:["The golden statue was about 27 metres tall. That’s like nine grown-ups standing on each other’s shoulders!","The friends said, ‘Even if God doesn’t save us, we still won’t bow.’ What does that show about their faith?","Draw a crown and write ‘God is King’ on it."],
24:["Jewish families still celebrate how God saved his people in Esther’s time, with a joyful festival called Purim.","Esther was afraid but went anyway. Can you be scared and brave at the same time?","Write: ‘Maybe God put me here for such a time as this.’ Then list the places God has put you."],
25:["Ruth came from Moab, a country that was often an enemy of Israel. God welcomed her into his family anyway!","Ruth stayed with Naomi when it would have been easier to leave. What does it mean to be a loyal friend?","Write the name of someone who might be lonely, and one kind thing you could do for her or him."],
26:["The Bible never tells us the servant girl’s name, but her faith changed an army captain’s whole life.","Naaman expected something big and dramatic. Does God always work in big ways?","Draw the brave little girl, and write one way you can tell a friend about God."],
27:["Isaiah lived about 700 years before Jesus was born. God’s clues were given a very long time ahead!","Why do you think God gave clues about Jesus so long before he came?","Write all four names from Isaiah 9:6 in beautiful decorated letters."],
29:["The Jordan River flows into the Dead Sea, the lowest place on land on the whole Earth.","God said he was pleased with Jesus before Jesus had done a single miracle. What does that tell you about God’s love for his children?","Write ‘I am a child of God’ in your fanciest letters and decorate it."],
30:["Fishermen on the Sea of Galilee usually fished at night, when the fish came up to the cool surface.","Peter said, ‘Because you say so, I will.’ What is something Jesus asks you to do, even when it’s hard?","Draw a net full of fish. On some of the fish, write names of people you would love to know Jesus."],
31:["The Sea of Galilee sits low between hills, so sudden winds can rush down and whip up big storms very quickly.","Jesus was asleep in the storm. Why wasn’t he worried?","Write Psalm 56:3 on a little card and keep it by your bed."],
32:["Apart from Jesus rising again, this is the only miracle written down in all four Gospels!","The boy’s lunch seemed too small to matter. What small things could you give to Jesus?","Draw five loaves and two fish. On each one, write something you can share."],
33:["In Jesus’ time, children weren’t treated as very important. Jesus surprised everyone by welcoming them.","Jesus said we must receive God’s kingdom like a child. What do you think he meant?","Write a letter to Jesus, as if you were sitting right next to him."],
34:["The disciples saw Jesus walking on the water some time between three and six in the morning, while it was still dark.","Peter really did walk on water for a while! What does that teach us about trusting Jesus?","Draw Jesus’ hand reaching out, and write: ‘Jesus catches me.’"],
36:["Bartimaeus is one of the few people Jesus healed whose name we know. His name means ‘son of Timaeus’.","Why do you think Jesus asked a blind man what he wanted, when it seemed so obvious?","Answer Jesus’ question: write what you would like him to do for you."],
37:["Sycamore-fig trees have low, wide branches that are perfect for climbing. Zacchaeus chose well!","Jesus didn’t tell Zacchaeus off. He went to his house. Why do you think that changed Zacchaeus’s heart?","Write about how you could include someone who often gets left out."],
38:["In Bible times, shepherds knew every sheep by name, and the sheep knew their shepherd’s voice (John 10:3–4).","Why would a shepherd leave 99 sheep to look for just one?","Draw the shepherd carrying the lamb, and write your own name on the lamb."],
39:["In Jesus’ time, it was thought undignified for an older man to run. The father didn’t care. He just wanted his child home!","There is an older brother in this story who was cross (Luke 15:25–32). Why might he have felt that way?","Write about how it feels to be forgiven."],
40:["The one man who came back was a Samaritan, someone most Jewish people of that time wouldn’t even talk to.","Why is it so easy to forget to say thank you?","Start a thankful list: write ten things, and add one more every day this week."],
41:["In Israel, dry riverbeds can suddenly fill with rushing water after a storm. A house built there could be swept away!","What does it look like to ‘build your life’ on Jesus’ words?","Draw two houses, one on the rock and one on the sand. Write a Bible verse on the rock."],
43:["Nazareth was a tiny village. Nobody expected anything special to come from there!","Mary said yes before she knew how everything would work out. Why is that hard?","Write your own ‘yes’ prayer to God."],
44:["The name Jesus comes from the Hebrew name Yeshua (Joshua), which means ‘the Lord saves’.","Joseph obeyed God straight away. What makes it hard to obey quickly?","Write ‘Immanuel: God with us’ and draw the places where God is with you."],
45:["The journey from Nazareth to Bethlehem was about 145 kilometres. On foot it would have taken around a week!","God used a Roman emperor’s law to keep his promise. What does that show about who is really in charge?","Draw a map of Mary and Joseph’s journey, with a star over Bethlehem."],
46:["Bethlehem means ‘house of bread’. Later, Jesus called himself ‘the bread of life’ (John 6:35)!","Why do you think the King of everything chose to be born in such a humble place?","Draw the manger and write one way you can make room for Jesus this Christmas."],
47:["Shepherds were often looked down on in Jesus’ time, yet God sent his good news to them first!","Why do you think God told shepherds first, instead of kings and queens?","Write the angels’ song: ‘Glory to God in the highest, and peace on earth!’"],
48:["The wise men probably visited when Jesus was a toddler, living in a house, not on the night he was born.","What does it mean to seek Jesus with all your heart?","Draw three gift boxes. In each one, write a gift you can give Jesus, like kindness or your time."],
49:["John 3:16 has been translated into thousands of languages, so people all over the world can read it.","God gave Jesus because he loves us, not because we earned it. Why is that such good news?","Write John 3:16, but put your own name where it says ‘the world’."],
51:["The cross is one of the best-known symbols in the world. Everywhere it reminds people of Jesus’ love.","Jesus forgave the people who hurt him. Is there someone you find hard to forgive?","Draw a cross with a heart, and write Romans 5:8 beside it."],
52:["More than 500 people saw Jesus alive after he rose from the dead (1 Corinthians 15:6)!","Why is the empty tomb the most important part of the whole story?","Write ‘He is risen!’ in big, joyful letters and decorate it with flowers."],
53:["Peter went on to become one of the great leaders of the early church, and he wrote two books of the Bible!","Jesus asked Peter three times, ‘Do you love me?’ Why do you think he asked three times?","Answer Jesus: write ‘Yes, Lord, I love you because…’ and finish the sentence."],
54:["This day is called Pentecost. Christians celebrate it as the birthday of the church!","The fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control (Galatians 5:22–23). Which one would you like more of?","Draw a fruit tree and label each fruit with one fruit of the Spirit."],
55:["Today there are Christians in almost every country of the world. The good news really did travel everywhere!","Jesus said, ‘Go and make disciples.’ What could that look like for a seven-year-old?","Write the names of three people you would love to tell about Jesus."]
};

D.forEach((d,i)=>{d.n=i+1;d.ex=EX.find(e=>d.n>=e.from&&d.n<=e.to)});

const SKY={day:["#78C3F0","#D5EFFB"],dawn:["#F4A07A","#FDE5C1"],sunset:["#E3667B","#F8C778"],night:["#07122C","#253A70"],storm:["#3C4658","#8A95A6"]};
let uid=0;
function starPts(cx,cy,r1,r2){let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?r2:r1;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1))}return p.join(" ")}
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function scene(code,seed){
  const [head,pr=""]=code.split(";");const w=head.trim().split(/\s+/);const sky=w[0],land=w[1],ex=(w[2]||"").split(",");

  if(sky==="night"){for(let i=0;i<40;i++){s+=`<circle cx="${(r()*400).toFixed(0)}" cy="${(r()*100).toFixed(0)}" r="${(r()*1.4+.4).toFixed(1)}" fill="#FFF6D8" opacity="${(r()*.6+.4).toFixed(2)}"/>`}

  if(sky==="sunset")s+=`<circle cx="330" cy="112" r="32" fill="#FFB24C"/>`;
  if(sky==="storm")s+=`<ellipse cx="90" cy="34" rx="90" ry="26" fill="#566174"/><ellipse cx="260" cy="26" rx="120" ry="28" fill="#4C576A"/><g stroke="#C9D3E0" stroke-width="1.5" opacity=".7">${Array.from({length:22},()=>{const x=r()*400,y=r()*120+30;return `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-6).toFixed(0)}" y2="${(y+14).toFixed(0)}"/>`}).join("")}</g>`;
  if(ex.includes("star"))s+=`<circle cx="300" cy="40" r="30" fill="#FFF3C4" opacity=".18"/><polygon points="${starPts(300,40,16,6.5)}" fill="#FFE27A"/>`;
  if(ex.includes("rainbow"))["#E85D5D","#F2A33A","#F5D547","#5DBB63","#4A90D9","#8E6CCF"].forEach((c,i)=>{const R=150-i*8;s+=`<path d="M${200-R} 150 A${R} ${R} 0 0 1 ${200+R} 150" fill="none" stroke="${c}" stroke-width="8" opacity=".85"/>`});
  const L={
    hills:`<ellipse cx="90" cy="182" rx="210" ry="62" fill="#86C98A"/><ellipse cx="330" cy="190" rx="230" ry="70" fill="#5AA866"/>`,
    sea:`<rect y="100" width="400" height="80" fill="${sky==="storm"?"#2A4F74":sky==="night"?"#1D3C6B":"#2F7FC1"}"/>`+[112,128,146,164].map((y,i)=>`<path d="M0 ${y} q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2" transform="translate(${i%2?-25:0} 0)"/>`).join(""),
    beach:`<rect y="96" width="400" height="84" fill="${sky==="storm"?"#2A4F74":"#3A8CCB"}"/><path d="M0 108 q25 -6 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2"/><path d="M0 150 Q200 124 400 146 L400 180 L0 180Z" fill="#EBD08E"/>`,
    desert:`<ellipse cx="80" cy="188" rx="230" ry="62" fill="#E8C372"/><ellipse cx="340" cy="194" rx="230" ry="66" fill="#D7A754"/>`,
    mountain:`<polygon points="50,160 200,30 350,160" fill="#7B8699"/><polygon points="168,60 200,30 232,60 216,66 200,56 184,66" fill="#F1F4F8"/><rect y="150" width="400" height="30" fill="#6AA86F"/>`,
    river:`<ellipse cx="90" cy="182" rx="210" ry="62" fill="#86C98A"/><ellipse cx="330" cy="190" rx="230" ry="70" fill="#5AA866"/><path d="M0 150 Q100 136 200 146 T400 140 L400 162 Q300 168 200 166 T0 172Z" fill="#4A9BE0"/>`,
    town:`<rect y="148" width="400" height="32" fill="#D8B878"/>`+[[20,108],[88,118],[262,112],[330,104]].map(([x,y])=>`<rect x="${x}" y="${y}" width="56" height="${150-y}" fill="#EEDFBE"/><rect x="${x+21}" y="${130}" width="14" height="20" fill="#9A6B3F"/><rect x="${x+6}" y="${y+8}" width="10" height="9" fill="#9A6B3F"/>`).join("")+`<circle cx="116" cy="118" r="14" fill="#EEDFBE"/>`,
    cave:`<rect y="140" width="400" height="40" fill="#6B5A45"/><path d="M0 0 L130 0 Q95 80 70 180 L0 180Z" fill="#4A3C2F"/><path d="M400 0 L270 0 Q305 80 330 180 L400 180Z" fill="#4A3C2F"/>`,
    redsea:`<rect y="118" width="400" height="62" fill="#E5C88A"/><path d="M0 40 Q90 30 150 60 L160 180 L0 180Z" fill="#2F7FC1"/><path d="M150 60 L160 180" stroke="#BFE2FF" stroke-width="5"/><path d="M400 40 Q310 30 250 60 L240 180 L400 180Z" fill="#2F7FC1"/><path d="M250 60 L240 180" stroke="#BFE2FF" stroke-width="5"/>`,
    garden:`<ellipse cx="90" cy="182" rx="210" ry="62" fill="#8ACF84"/><ellipse cx="330" cy="190" rx="230" ry="70" fill="#5DAF62"/>`+Array.from({length:18},()=>`<circle cx="${(r()*400).toFixed(0)}" cy="${(r()*30+148).toFixed(0)}" r="3" fill="${r()>.5?"#FF8FB1":"#FFE066"}"/>`).join(""),
    campfire:`<path d="M0 120 L30 70 L60 120Z M40 125 L80 55 L120 125Z M300 120 L335 60 L370 120Z M350 125 L380 75 L410 125Z" fill="#183326"/><ellipse cx="200" cy="190" rx="300" ry="62" fill="#2E4C39"/><circle cx="200" cy="150" r="60" fill="#FFB347" opacity=".18"/><rect x="165" y="160" width="70" height="9" rx="4" fill="#7A4B2A" transform="rotate(12 200 165)"/><rect x="165" y="160" width="70" height="9" rx="4" fill="#8B5A33" transform="rotate(-12 200 165)"/>`
  };
  s+=L[land]||"";
  if(ex.includes("pyramids"))s+=`<polygon points="250,140 300,80 350,140" fill="#C99A4B"/><polygon points="320,142 352,104 384,142" fill="#B98A3E"/>`;
  if(ex.includes("walls"))s+=`<rect x="80" y="92" width="240" height="58" fill="#C8A56A"/>`+Array.from({length:12},(_,i)=>`<rect x="${80+i*20}" y="84" width="11" height="10" fill="#C8A56A"/>`).join("")+`<rect x="185" y="112" width="30" height="38" rx="15" fill="#7A5631"/>`;
  if(ex.includes("statue"))s+=`<rect x="185" y="62" width="30" height="90" fill="#E5B93C"/><circle cx="200" cy="52" r="14" fill="#E5B93C"/><rect x="175" y="148" width="50" height="10" fill="#B98A2A"/>`;
  if(ex.includes("ark"))s+=`<polygon points="100,112 300,112 278,140 122,140" fill="#8B5A33"/><rect x="150" y="90" width="100" height="24" fill="#A06A3D"/><polygon points="145,92 200,74 255,92" fill="#7A4B2A"/>`;
  if(ex.includes("stable"))s+=`<rect x="140" y="112" width="120" height="58" fill="#8B5A33"/><polygon points="128,114 200,78 272,114" fill="#6E4325"/><rect x="178" y="134" width="44" height="36" fill="#3A2416"/><rect x="180" y="158" width="40" height="8" fill="#E9C46A"/>`;
  if(ex.includes("cross"))s+=`<rect x="196" y="50" width="9" height="100" fill="#5B3A29"/><rect x="174" y="72" width="53" height="9" fill="#5B3A29"/>`;
  if(ex.includes("tomb"))s+=`<ellipse cx="200" cy="150" rx="100" ry="58" fill="#8D8A84"/><ellipse cx="190" cy="140" rx="22" ry="26" fill="#2B2622"/><circle cx="262" cy="148" r="24" fill="#A9A59E"/>`;
  if(ex.includes("tree"))s+=`<rect x="292" y="80" width="18" height="80" fill="#7A4B2A"/><circle cx="300" cy="72" r="46" fill="#3E8E4F"/><circle cx="270" cy="88" r="26" fill="#4A9C5A"/><circle cx="330" cy="88" r="26" fill="#4A9C5A"/>`;
  if(ex.includes("rock"))s+=`<polygon points="30,180 50,132 90,122 130,134 150,180" fill="#7C7A74"/>`;
  if(ex.includes("flakes"))s+=Array.from({length:40},()=>`<circle cx="${(r()*400).toFixed(0)}" cy="${(r()*44+134).toFixed(0)}" r="2" fill="#FFFFFF"/>`).join("");
  if(sky==="night"&&land!=="campfire")s+=`<rect y="90" width="400" height="90" fill="#081430" opacity=".3"/>`;
  pr.trim().split(/\s+/).filter(Boolean).forEach(t=>{const m=t.match(/^(.+?)(\d+),(\d+),(\d+)$/u);if(m)s+=`<text x="${m[2]}" y="${m[3]}" font-size="${m[4]}" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">${m[1]}</text>`});
  return s+"</svg>";
}
function gem(c,size=26){return `<svg class="gem" width="${size}" height="${size}" viewBox="0 0 26 26" aria-hidden="true"><polygon points="7,3 19,3 24,10 13,24 2,10" fill="${c}"/><polygon points="7,3 19,3 16,10 10,10" fill="#FFFFFF" opacity=".35"/><polygon points="2,10 10,10 13,24" fill="#000000" opacity=".12"/></svg>`}
const exc=e=>`var(--ex${e.n})`;

/* ---------- STATE ---------- */
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("lt-g-done")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("lt-g-done",JSON.stringify([...done]))}catch(e){}}
function nextDay(){for(let i=1;i<=56;i++)if(!done.has(i))return i;return 56}
const app=document.getElementById("app");

/* ---------- VIEWS ---------- */
function heroArt(){

  const pts=[[40,170],[130,150],[220,162],[310,140],[400,152],[490,132],[580,146],[670,124],[760,134]];

}

  const n=nextDay(),cnt=done.size;
  let h=`<section class="hero gutter"><div class="inner">
    <span class="ex-tag" style="--exc:var(--amber)">Starlight Edition</span>
    <h1>The <span>Lantern</span> Trail</h1>
    <p class="lede">A bedtime adventure for you and your girl: 56 nights to discover who God is, what he is like, and what it means to be a child of God and a friend of Jesus.</p>
    <p class="theme-verse">“Your word is a lamp for my feet and a light on my path.”<small>Psalm 119:105</small></p>

  EX.forEach(e=>{
    h+=`<div style="--exc:${exc(e)}"><div class="ex-head"><span class="ex-tag">Expedition ${e.n} · Days ${e.from}–${e.to}</span><h2>${e.name}</h2><p>${e.blurb}</p></div><div class="stones">`;
    for(let i=e.from;i<=e.to;i++){const d=D[i-1];
      h+=`<a class="stone${done.has(i)?" done":""}${d.c?" camp":""}${i===n&&!done.has(i)?" next":""}" href="#day-${i}"><span class="num">${done.has(i)?"✓":i}</span><span class="st">${d.c?(d.xmas?"Christmas Campfire":d.fin?"Grand Campfire":"Campfire Night"):d.t}</span><span class="sg">${d.c?"Review night":(done.has(i)?"Found: ":"")+d.g}</span></a>`}
    h+=`</div></div>`});

function sign(n,label){return `<h2 class="sign"><b>${n}</b>${label}</h2>`}
function bubble(v){return `<blockquote class="bubble"><q>${v[0]}</q><cite>${v[1]}</cite></blockquote>`}
function prayer(p,own=true){return `<div class="prayer">${p.split(" / ").map(l=>`<span class="line">${l}</span>`).join("")}${own?`<p class="own">Now add your own words to God: a thank you, a sorry, a please, or anything on your heart.</p>`:""}</div>`}
function mission(m){const c=CP[m[0]];return `<div class="mission" style="--pc:var(--${c[2]})"><div class="cbadge">${compassMini(c[2])}<span>${c[0]}</span></div><p>${m[1]}</p></div>`}
function compassMini(k){const a={talk:0,listen:90,trust:180,love:270}[k];return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/><g transform="rotate(${a} 20 20)"><polygon points="20,5 25,20 15,20" fill="currentColor"/><polygon points="20,35 25,20 15,20" fill="currentColor" opacity=".3"/></g></svg>`}
function showDay(n){
  if(n<1||n>56){location.hash="";return}
  const d=D[n-1],e=d.ex;let h=`<section class="page gutter" style="--exc:${exc(e)}"><div class="inner">
  <div class="crumbs"><a href="#map">← Trail Map</a><span class="pn">${n>1?`<a href="#day-${n-1}">‹ Day ${n-1}</a>`:""}${n<56?`<a href="#day-${n+1}">Day ${n+1} ›</a>`:""}</span></div>

    <section class="step">${sign(4,"Treasure found")}<ul class="treasure">${d.l.map(x=>`<li>${gem(exc(e),18)}<span>${x}</span></li>`).join("")}</ul>${X[n]?`<div class="fact">${gem(exc(e),24)}<p><small>Did you know?</small>${X[n][0]}</p></div>`:""}</section>
    <section class="step">${sign(5,"Adventure talk")}<ol class="talk">${d.q.map(x=>`<li>${x}</li>`).join("")}${X[n]?`<li class="deeper"><b>Think deeper:</b> ${X[n][1]}</li>`:""}</ol></section>

    <section class="step">${sign(2,"Treasures from this expedition")}<p class="tip">Point to each one. Can she tell you the story that goes with it?</p><div class="gems">${ds.map(x=>`<a href="#day-${x.n}">${gem(exc(e),28)}<span><b>${x.tr}</b><small>Day ${x.n} · ${x.t}</small></span></a>`).join("")}</div></section>
    <section class="step">${sign(3,"Treasure Verse")}${bubble(e.v)}<p class="tip">This expedition's verse to learn by heart. Make up actions for each part.</p></section>
    <section class="step">${sign(4,"Campfire game")}<div class="card"><p>${d.game}</p></div></section>
    <section class="step">${sign(5,"Adventure talk")}<ol class="talk">${d.q.map(x=>`<li>${x}</li>`).join("")}</ol></section>
    <section class="step">${sign(6,"Talk to God")}${prayer(d.p)}</section>
    <section class="step">${sign(7,"Explorer mission")}${mission(d.m)}</section>
    <section class="step">${sign(8,"Explorer's journal")}<div class="journal"><p>Draw your favourite treasure from this expedition, and write why it is special to you.</p></div></section>`;
    if(d.fin){h+=`<section class="step">${sign("★","Would you like to follow Jesus?")}<div class="card invite"><p><b>For Mom:</b> Over these nights she has heard that God made her, loves her, came looking for her, and sent Jesus to rescue her. If she says she wants to be a child of God and a friend and follower of Jesus, you can pray this together. At seven she may have real questions, so welcome them. Only if she wants to: never press. If she is not ready, that is fine. The trail keeps going, and you can come back to this any night.</p>${prayer("Dear Jesus, / I believe you are God's Son. / Thank you for dying on the cross for me / and coming alive again. / I'm sorry for the wrong things I do. / Please forgive me. / I want to follow you and be your friend forever. / Thank you that I am a child of God. / Please fill me with your Holy Spirit. Amen.",false)}<p>If she prays this, celebrate! Write the date in her Bible (she might like to write it herself) and tell someone who loves her. Heaven is having a party (remember the lost sheep?).</p></div></section>
    <section class="step">${sign("★","Explorer certificate")}<div class="cert"><span class="eyebrow">The Lantern Trail</span><h3>Official Trail Explorer</h3><span class="eyebrow">Child of God · Friend of Jesus</span><span class="nm" id="certName">${esc(getName())||"&nbsp;"}</span><p>has walked all 56 nights of the Lantern Trail and discovered that God is Creator, Holy, Mighty, Good, Kind, King, Friend and Saviour, and that he is with me always.</p><div class="row"><label for="explorer">Explorer's name</label><input id="explorer" type="text" maxlength="30" value="${esc(getName())}" placeholder="Type your name"></div><p class="tip">Take a screenshot of this certificate to keep, or copy it onto paper together.</p></div></section>`}
  }

  };

}
function getName(){try{return localStorage.getItem("lt-g-name")||""}catch(e){return ""}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let tt;function toast(m){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function showGuide(){
  app.innerHTML=`<section class="page gutter"><div class="inner prose">
  <header class="day-head"><span class="eyebrow" style="--exc:var(--forest)">For Mom</span><h1>How the Lantern Trail works</h1></header>
  <p>Each night is one stop on the trail. Every Bible story uncovers a <b>treasure</b>: one part of God's character, such as <i>God is holy</i>, <i>God provides</i> or <i>Jesus never stops looking for me</i>. Over 56 nights your daughter collects them all, and learns along the way what it means to be a child of God and a friend of Jesus.</p>
  <p>There are 8 expeditions. Each one ends with a <b>Campfire Night</b>: a review evening with a game, the week's Treasure Verse and no new story, so the truths sink in.</p>
  <h2>Tonight's rhythm (10 to 15 minutes)</h2>
  <ol class="rhythm">
   <li><span><b>Light the lantern.</b> Dim the lights and switch on a torch or bedside lamp. It becomes her signal that trail time has started.</span></li>
   <li><span><b>Story trail.</b> Read the story aloud, or take turns reading a paragraph each. Let her do the sound effects and voices.</span></li>
   <li><span><b>God's Word says.</b> Let her read the verse herself, find it in her own Bible, then try saying it from memory.</span></li>
   <li><span><b>Treasure found.</b> Read the three lessons and the “Did you know?” fact.</span></li>
   <li><span><b>Adventure talk.</b> Ask one or two questions. The “Think deeper” question is for nights when she is chatty. Real conversations matter more than right answers.</span></li>
   <li><span><b>Talk to God.</b> Read the prayer together or take turns with the lines. Then give her space to pray in her own words.</span></li>
   <li><span><b>Explorer mission.</b> A small thing to try tomorrow. Tap “We did it! Collect the treasure” to light up that stone on the map.</span></li>
   <li><span><b>Explorer's journal (optional).</b> A writing or drawing prompt for her notebook, tonight or the next day.</span></li>
   <li><span><b>Goodnight words.</b> Before lights out, say together: “I am a child of God and a friend of Jesus!” Said every night, it becomes who she knows she is.</span></li>
  </ol>
  <h2>Where the trail lands</h2>
  <p>If Day 1 is <b>6 November</b>, the trail follows the calendar like this:</p>
  <div class="dates"><div><b>Day 1</b><span>6 November</span></div><div><b>Day 26</b><span>1 December</span></div><div><b>Day 43</b><span>18 December: Christmas trail starts</span></div><div><b>Day 49</b><span>24 December</span></div><div><b>Day 50</b><span>25 December: Christmas Campfire</span></div><div><b>Day 56</b><span>31 December: Grand Campfire</span></div></div>
  <p>If you start later or miss a few nights, don't worry. Just jump to <b>Day 43 on 18 December</b> so that Day 50 falls on Christmas Day, and read any skipped stories in the new year or on a campfire night.</p>
  <h2>Tips for a 5-year-old</h2>
  <ul class="tips">
   <li>At seven she can read parts herself. Let her read the verse, the prayer or a paragraph of the story. It builds confidence and ownership.</li>
   <li>Give her a special notebook (and some gel pens) for the Explorer's Journal. Some nights it will be a drawing, some nights a sentence. Both are perfect.</li>
   <li>Use a real Bible for the “Find it” step. Learning to look up a verse is a treasure in itself.</li>
   <li>Expect big questions (“Why did God let that happen?”). It is fine to say “I don’t know, let’s ask God and find out together.”</li>
   <li>Kids learn most from watching your own walk with God. Share a short “God helped me today when…” story now and then.</li>
   <li>Keep it warm and short rather than complete. Missing a part is better than a tired, grumpy end to the day.</li>
   <li>Keep a children's Bible nearby. When she wants more, read the same story from it.</li>
   <li>The verses are given in simple wording for children. The references let you look them up in your own Bible.</li>
  </ul>
  <p class="tip">Your progress and her name on the certificate are saved in this browser on this device only.</p>
  <p><a class="btn" href="#day-${nextDay()}">Go to Day ${nextDay()}</a></p>
  </div></section>`;
}
function showCompass(){
  const pts=[["T","talk","Talk","We talk to God in prayer. We can tell him anything: thank you, sorry, please, and what happened today. He always hears."],["L","listen","Listen","God talks to us mostly through the Bible. When we read his stories and verses, we get to know what he is like."],["R","trust","Trust","Friends trust each other. We believe God is good and do what he says, even when it is hard or seems strange."],["V","love","Love","We love God most of all, and we show it by loving the people around us: sharing, forgiving and being kind."]];
  app.innerHTML=`<section class="page gutter"><div class="inner prose">
  <header class="day-head"><span class="eyebrow" style="--exc:var(--forest)">Friendship Compass</span><h1>Child of God, friend of Jesus</h1></header>
  <p>God wants to be her loving Father, and Jesus wants to be her best friend. A child stays close to a good dad, and friends spend time together: they talk, they listen, they trust each other and they show love. Every Explorer Mission on the trail points to one of these four directions, so she practises a real relationship with God, not just facts about him.</p>
  <div class="compass-wrap"><svg viewBox="0 0 200 200" aria-label="Compass with four points: Talk, Listen, Trust, Love"><circle cx="100" cy="100" r="92" fill="var(--surface)" stroke="var(--line)" stroke-width="4"/><circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 6"/><polygon points="100,22 112,100 88,100" fill="var(--talk)"/><polygon points="178,100 100,112 100,88" fill="var(--listen)"/><polygon points="100,178 88,100 112,100" fill="var(--trust)"/><polygon points="22,100 100,88 100,112" fill="var(--love)"/><circle cx="100" cy="100" r="9" fill="var(--amber)"/><text x="100" y="16" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--talk)">TALK</text><text x="100" y="196" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--trust)">TRUST</text><text x="186" y="80" text-anchor="end" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--listen)">LISTEN</text><text x="14" y="80" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="var(--love)">LOVE</text></svg>
  <div class="points">${pts.map(p=>`<div class="point" style="--pc:var(--${p[1]})"><h3>${p[2]}</h3><p>${p[3]}</p></div>`).join("")}</div></div>
  <h2>How do I become a child of God and a friend of Jesus?</h2>
  <p>Explain it to her in three simple steps, the same way the trail tells it:</p>
  <ol class="tips"><li><b>God made me and loves me</b> (Days 1–3). He wants to be close to me.</li><li><b>Sin puts a wall between us</b> (Days 3 and 49). The wrong things we do keep us far from God.</li><li><b>Jesus broke down the wall</b> (Days 49–52). He died for my sin and came alive again. When I say sorry and ask Jesus to be my Lord and my friend, God forgives me, I become his child, and his Holy Spirit lives in me.</li></ol>
  <p>The Grand Campfire on Day 56 includes a simple prayer she can pray if she wants to follow Jesus.</p>
  </div></section>`;
}
function route(){
  const h=location.hash.slice(1);let tab="map";
  if(/^day-\d+$/.test(h)){showDay(parseInt(h.slice(4),10));tab="day"}
  else if(h==="guide"){showGuide();tab="guide"}
  else if(h==="compass"){showCompass();tab="compass"}
  else showMap();
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
