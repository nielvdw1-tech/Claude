# Netlify settings: publish the new website from the prototype folder.
# The free compliance check sends results to Netlify Forms (form name "compliance-check").
[build]
  publish = "prototype"

# Keep the working notes and tools off the public site
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/*.md"
  to = "/404"
  status = 404
  force = true
