<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDW HSEQ Management System (Prototype)</title>
  <meta name="description" content="Interactive prototype of the VDW HSEQ Management System — demonstration data only.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sb-backdrop" data-act="toggleNav"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="demo-ribbon" role="note">
        <b>PROTOTYPE · DEMONSTRATION DATA.</b>
        <span>Fictional companies and records. Data is stored only in this browser. No real sign-in, permanent document storage, email notifications or server-side security. Legal references are illustrative and require verification.</span>
      </div>
      <main class="content" id="content" tabindex="-1">
        <noscript><div class="alert danger">This prototype needs JavaScript enabled in your browser.</div></noscript>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Demonstration data model (fictional) -->
  <script src="data.js"></script>
  <!-- Core: state, routing, shell, compliance & notification engines, CAPA workflow, dashboard -->
  <script src="app.js"></script>
  <!-- Modules -->
  <script src="mod-documents.js"></script>
  <script src="mod-legal-risk.js"></script>
  <script src="mod-people.js"></script>
  <script src="mod-operations.js"></script>
  <script src="mod-incidents-audits.js"></script>
  <script src="mod-actions-reports-admin.js"></script>
</body>
</html>
