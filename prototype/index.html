<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDW HSEQ Management System</title>
  <meta name="description" content="Interactive prototype of the VDW compliance control system: document approvals, asset inspections with corrective actions, and incident management. Demonstration data only.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sb-backdrop" data-act="toggleNav"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="demo-ribbon" role="note">
        <b>PROTOTYPE · DEMONSTRATION DATA.</b>
        <span>Fictional companies and records. Data is stored only in this browser. No real sign-in, permanent document storage, email notifications or server-side security.</span>
      </div>
      <main class="content" id="content" tabindex="-1">
        <noscript><div class="alert danger">This prototype needs JavaScript enabled in your browser.</div></noscript>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- QR code generator (vendor/qr, MIT) -->
  <script src="vendor/qr/qrcode.js"></script>
  <!-- Demonstration data model (fictional) -->
  <script src="data.js"></script>
  <!-- Core: state, routing, shell, compliance & notification engines, CAPA workflow, dashboard -->
  <script src="app.js"></script>
  <!-- Sign-in (simulated): accounts, passwords, deactivation -->
  <script src="mod-auth.js"></script>
  <!-- Roles: areas of the system and permissions per role -->
  <script src="mod-roles.js"></script>
  <!-- Locked records, amendments, hash-chained audit trail -->
  <script src="mod-audit.js"></script>
  <!-- E-mail outbox (simulated) and notification settings -->
  <script src="mod-mail.js"></script>
  <!-- Backup and restore (all records and stored files) -->
  <script src="mod-backup.js"></script>
  <!-- QR codes: labels and scanning (jsQR loaded on first scan) -->
  <script src="mod-qr.js"></script>
  <!-- Bulk import from Excel (.xlsx) or CSV -->
  <script src="mod-import.js"></script>
  <!-- Hours worked and the LTI frequency rate -->
  <script src="mod-hours.js"></script>
  <!-- Control score history (monthly snapshots) -->
  <script src="mod-history.js"></script>
  <!-- Stamped downloads of controlled documents (pdf-lib loaded on first use) -->
  <script src="mod-stamp.js"></script>
  <!-- Reading a document's own header on upload (number, title, revision) -->
  <script src="mod-docread.js"></script>
  <!-- Several clients: separation, overview and new-client wizard -->
  <script src="mod-clients.js"></script>
  <!-- Privacy (POPIA): medical-detail access log, retention, removing personal details -->
  <script src="mod-privacy.js"></script>
  <!-- Modules -->
  <script src="mod-documents.js"></script>
  <script src="mod-operations.js"></script>
  <script src="mod-inspections-incidents.js"></script>
  <script src="mod-actions-reports-admin.js"></script>
  <!-- File storage (browser) and viewer; PDF.js is loaded from vendor/pdfjs on first use -->
  <script src="mod-files.js"></script>
  <!-- Company notices (memos / important information) -->
  <script src="mod-notices.js"></script>
  <!-- Dashboard: compliance status, 12-month trends, detail tiles -->
  <script src="mod-dashboard.js"></script>
  <script src="mod-docack.js"></script>
  <script src="mod-offline.js"></script>
  <script src="mod-insp-plus.js"></script>
  <script src="mod-inc-plus.js"></script>
</body>
</html>
